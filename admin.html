<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 사진 관리자 - 상권 현장방문 시스템</title>
    <meta name="description" content="상권 현장방문 사진 관리자 페이지 - 날짜/촬영자/제목(업체명)별 검색 및 다운로드">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=yunk7qz7lm&submodules=geocoder"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;600;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .row-animate {
            animation: fadeInRow 0.25s ease forwards;
        }

        @keyframes slideInToast {
            from {
                transform: translateX(110%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-anim {
            animation: slideInToast 0.35s ease forwards;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* 라이트박스 */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 11000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        #lightbox.hidden {
            display: none;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 92vh;
            border-radius: 4px;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
        }

        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11001;
        }

        /* 지도 (기본 380px, 확대 시 680px) */
        #admin-map {
            width: 100%;
            height: 380px;
            border-radius: 12px;
            transition: height 0.35s ease-in-out;
        }
        #admin-map.map-expanded {
            height: 680px;
        }
        @media (min-width: 768px) {
            #admin-map {
                height: 520px;
            }
        }
        /* 지도 마커 팝업 스타일 */
        .marker-popup {
            background: white;
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            min-width: 180px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            font-family: 'Noto Sans KR', sans-serif;
            z-index: 100;
        }
        .marker-popup .biz-name {
            font-size: 14px;
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 4px;
            letter-spacing: -0.025em;
        }
        .marker-popup .meta-info {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        /* ── 인쇄 전용 ── */
        #print-area { display: none; }

        @media print {
            @page { size: A4; margin: 10mm; }
            body, html { background: white !important; overflow: visible !important; height: auto !important; }
            body > *:not(#print-area) { display: none !important; }
            #print-area { display: block !important; }
            .print-page {
                width: 190mm;   /* A4 폭(210mm) - 좌우 여백(10mm×2) */
                height: 277mm;  /* A4 높이(297mm) - 상하 여백(10mm×2) */
                padding: 0;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .print-page-break { page-break-after: always; break-after: page; }
            .print-header {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                border-bottom: 3px solid #1e293b;
                padding-bottom: 6px;
                margin-bottom: 8px;
                flex-shrink: 0;
            }
            .print-title {
                font-size: 16pt;
                font-weight: 900;
                color: #000;
                margin: 0;
                font-family: 'Noto Sans KR', sans-serif;
            }
            .print-page-num { font-size: 9pt; color: #666; font-weight: 600; }
            .print-layout-stack {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 4mm;
                min-height: 0;
                overflow: hidden;
            }
            .print-layout-stack .print-photo-cell {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            .print-layout-grid {
                flex: 1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 4mm;
                min-height: 0;
                overflow: hidden;
            }
            .print-photo-cell {
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                min-height: 0;
            }
            .print-photo-cell img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                display: block;
            }
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>
    <div id="print-area"></div>

    <!-- 라이트박스 -->
    <div id="lightbox" class="hidden" onclick="closeLightbox()">
        <span id="lightbox-close" onclick="closeLightbox()">&#x2715;</span>
        <img id="lightbox-img" src="" alt="확대 사진" onclick="event.stopPropagation()">
    </div>

    <script>
        // 전역 라이트박스 제어 함수 (스크롤 락 포함)
        window.openLightbox = function(url) {
            const imgEl = document.getElementById('lightbox-img');
            // Drive URL인 경우 lh3 프록시 사용 (깨짐 방지)
            let finalUrl = url;
            const m1 = url.match(/[?&]id=([^&]+)/);
            const m2 = url.match(/\/d\/([^/]+)/);
            if (m1) finalUrl = 'https://lh3.googleusercontent.com/d/' + m1[1];
            else if (m2) finalUrl = 'https://lh3.googleusercontent.com/d/' + m2[1];

            imgEl.src = finalUrl;
            document.getElementById('lightbox').classList.remove('hidden');
            document.body.classList.add('modal-open');
        };
        window.closeLightbox = function() {
            document.getElementById('lightbox').classList.add('hidden');
            if (!document.querySelector('.fixed.inset-0.z-\\[10000\\]')) { // 다른 모달이 없을 때만 해제
                document.body.classList.remove('modal-open');
            }
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // ── 설정 ──
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsmES-1l_IWNkDZkjA8S0ft4bADEYO_IMYelAXziftQGVZLEZlCaVkONgYSea0ty5vag/exec';
        const API_SECRET = 'fp_k3y_9898_security_v1!';
        // ADMIN_PW는 보안을 위해 서버(Apps Script)에서만 관리합니다.

        // ── Google Drive 이미지 URL 변환 (lh3 프록시 사용으로 이미지 로드 개선) ──
        function toThumbUrl(url) {
            if (!url) return '';
            // https://drive.google.com/uc?export=view&id=FILE_ID 에서 FILE_ID 추출
            const m = url.match(/[?&]id=([^&]+)/);
            if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
            return url;
        }

        // ── 날짜 한글 포맷 ("2026년 4월 20일 오후 8:42") ──
        function formatDateKr(dtStr) {
            if (!dtStr) return '-';
            // Apps Script에서 이미 한글로 저장된 경우 그대로 반환
            if (/\uB144/.test(dtStr)) return dtStr;
            // 이전 형식 ("2026-04-20 20:42:19" 또는 JS Date 문자열) 변환
            const d = new Date(dtStr);
            if (isNaN(d.getTime())) return dtStr;
            const y = d.getFullYear();
            const mo = d.getMonth() + 1;
            const day = d.getDate();
            const h = d.getHours();
            const min = String(d.getMinutes()).padStart(2, '0');
            const ampm = h < 12 ? '오전' : '오후';
            const h12 = h % 12 === 0 ? 12 : h % 12;
            return `${y}\ub144 ${mo}\uc6d4 ${day}\uc77c ${ampm} ${h12}:${min}`;
        }

        // ── 헬퍼: Drive URL → lh3 썸네일 URL ──
        function driveImgUrl(url) {
            if (!url) return '';
            let id = '';
            const m1 = url.match(/[?&]id=([^&]+)/);
            const m2 = url.match(/\/d\/([^/]+)/);
            if (m1) id = m1[1];
            else if (m2) id = m2[1];
            if (!id) return url;
            return 'https://lh3.googleusercontent.com/d/' + id;
        }

        // ── 헬퍼: 날짜 한글 형식 변환 ──
        function formatDateKo(dt) {
            if (!dt) return '-';
            // 이미 한글 형식이면 그대로 반환
            if (dt.includes('\ub144') && dt.includes('\uc6d4')) return dt;
            // 구형식 (영문/ISO 날짜)
            const d = new Date(dt);
            if (isNaN(d.getTime())) return dt;
            const y = d.getFullYear();
            const mo = d.getMonth() + 1;
            const day = d.getDate();
            const h = d.getHours();
            const min = String(d.getMinutes()).padStart(2, '0');
            const ampm = h < 12 ? '\uc624\uc804' : '\uc624\ud6c4';
            const h12 = h % 12 === 0 ? 12 : h % 12;
            return y + '\ub144 ' + mo + '\uc6d4 ' + day + '\uc77c ' + ampm + ' ' + h12 + ':' + min;
        }

        // ── 아이콘 컴포넌트 ──
        const Icon = ({ name, size = 18, className = '' }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    // 해당 요소 내부만 아이콘으로 변환하도록 제한 (충돌 방지)
                    window.lucide.createIcons({
                        nameAttr: 'data-lucide',
                        root: iconRef.current
                    });
                }
            }, [name, size]);

            // key={name}을 주어 아이콘이 바뀔 때마다 span 자체를 새로 생성 (React DOM 동기화 문제 해결)
            return <span 
                key={name}
                ref={iconRef} 
                className={`inline-flex items-center justify-center ${className}`}
                style={{ verticalAlign: 'middle', width: size, height: size }}
            >
                <i data-lucide={name} style={{ width: size, height: size }}></i>
            </span>;
        };

        // ── 토스트 ──
        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
            const bg = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-blue-600' };
            return (
                <div className={`fixed top-6 right-6 z-[12000] ${bg[type] || bg.info} text-white px-5 py-3 rounded-xl shadow-2xl font-bold text-sm toast-anim flex items-center gap-2`}>
                    <Icon name={type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info'} size={16} />
                    {message}
                </div>
            );
        };

        // ── 로그인 ──
        const Login = ({ onLogin }) => {
            const [pw, setPw] = useState('');
            const [err, setErr] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const cleanPw = pw.trim();
                if (!cleanPw) {
                    setErr('비밀번호를 입력해 주세요.');
                    return;
                }
                setLoading(true); setErr('');
                const res = await onLogin(cleanPw);
                if (!res || !res.success) {
                    setErr(res && res.error ? res.error : '접속 인증 실패');
                    setPw('');
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                        <div className="bg-gradient-to-br from-slate-900 to-slate-700 p-8 text-center">
                            <div className="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4">
                                <Icon name="camera" size={30} className="text-white" />
                            </div>
                            <h1 className="text-xl font-black text-white">현장 사진 관리자</h1>
                            <p className="text-slate-400 text-sm mt-1 font-semibold">상권 현장방문 사진 관리 시스템</p>
                        </div>
                        <form onSubmit={handleSubmit} className="p-8 space-y-5">
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Password</label>
                                <input
                                    type="password" autoFocus disabled={loading}
                                    className={`w-full px-4 py-4 bg-slate-50 border-2 rounded-xl outline-none text-center text-2xl font-black tracking-[0.5em] transition-all ${err ? 'border-red-400 bg-red-50' : 'border-slate-100 focus:border-blue-500 focus:bg-white'}`}
                                    value={pw} onChange={e => setPw(e.target.value)} placeholder="••••••••••"
                                />
                                {err && <p className="text-red-500 text-xs font-bold text-center mt-2">{err}</p>}
                            </div>
                            <button type="submit" disabled={loading}
                                className="w-full py-4 bg-slate-900 text-white rounded-xl font-black text-sm shadow-lg hover:bg-slate-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                                <Icon name={loading ? 'loader-2' : 'log-in'} size={18} className={loading ? 'animate-spin' : ''} />
                                {loading ? '인증 중...' : '접속하기'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ── 사진 갤러리 모달 ──
        const PhotoGalleryModal = ({ group, onClose, onDownload, onDownloadSingle, memoUpdater, photoDeleter }) => {
            console.log('PhotoGalleryModal Rendered. memoUpdater type:', typeof memoUpdater);
            if (!group || !group.photos) return null;

            const [editMemoId, setEditMemoId] = useState(null);
            const [memoValue, setMemoValue] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [printMode, setPrintMode] = useState(false);
            const [selectedForPrint, setSelectedForPrint] = useState(new Set());

            const groupPhotos = group.photos;

            const handleMemoClick = (photo) => {
                setEditMemoId(photo.fileId);
                setMemoValue(photo.memo || '');
            };

            const handleDeletePhotoClick = async (photo) => {
                if (!confirm('이 사진을 정말 삭제하시겠습니까?\n(구글 드라이브 휴지통 이동 및 구글 시트에서 삭제됩니다)')) return;
                if (typeof photoDeleter !== 'function') {
                    alert('오류: 삭제 처리 함수가 연결되지 않았습니다. 페이지를 새로고침(F5) 해주세요.');
                    return;
                }
                try {
                    setIsSaving(true);
                    await photoDeleter(photo.fileId);
                } catch (err) {
                    console.error('handleDeletePhotoClick error:', err);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleSaveMemo = async (fileId) => {
                if (typeof memoUpdater !== 'function') {
                    alert('오류: 메모 저장 함수가 연결되지 않았습니다. 페이지를 새로고침(F5) 해주세요.');
                    return;
                }
                try {
                    setIsSaving(true);
                    const ok = await memoUpdater(fileId, memoValue);
                    // Toast는 updateMemo에서도 띄우지만 여기서도 성공 시 확인 가능
                } catch (err) {
                    console.error('handleSaveMemo error:', err);
                    setToast({ message: '저장 처리 중 오류가 발생했습니다.', type: 'error' });
                } finally {
                    setIsSaving(false);
                }
            };

            const togglePrintSelect = (idx) => {
                setSelectedForPrint(prev => {
                    const next = new Set(prev);
                    if (next.has(idx)) next.delete(idx);
                    else next.add(idx);
                    return next;
                });
            };

            const executePrint = async () => {
                const selected = groupPhotos.filter((_, idx) => selectedForPrint.has(idx));
                if (selected.length === 0) return;

                const printArea = document.getElementById('print-area');
                const bizName = group.bizNumber || '제목 없음';
                const useStack = selected.length <= 2;

                const pages = [];
                if (selected.length <= 4) {
                    pages.push(selected);
                } else {
                    for (let i = 0; i < selected.length; i += 4) {
                        pages.push(selected.slice(i, i + 4));
                    }
                }

                const totalPages = pages.length;
                let html = '';
                pages.forEach((pagePhotos, pageIdx) => {
                    const isLast = pageIdx === totalPages - 1;
                    const layoutClass = useStack ? 'print-layout-stack' : 'print-layout-grid';
                    html += '<div class="print-page' + (isLast ? '' : ' print-page-break') + '">';
                    html += '<div class="print-header">';
                    html += '<h1 class="print-title">' + bizName + '</h1>';
                    if (totalPages > 1) html += '<span class="print-page-num">' + (pageIdx + 1) + ' / ' + totalPages + '</span>';
                    html += '</div>';
                    html += '<div class="' + layoutClass + '">';
                    pagePhotos.forEach(p => {
                        html += '<div class="print-photo-cell"><img src="' + toThumbUrl(p.photoUrl) + '" /></div>';
                    });
                    html += '</div></div>';
                });

                printArea.innerHTML = html;

                // 이미지 로딩 대기
                const imgs = printArea.querySelectorAll('img');
                await Promise.all(Array.from(imgs).map(img => {
                    if (img.complete) return Promise.resolve();
                    return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
                }));

                window.print();
                setTimeout(() => {
                    printArea.innerHTML = '';
                    setPrintMode(false);
                    setSelectedForPrint(new Set());
                }, 500);
            };

            return (
                <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
                    <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col ring-1 ring-slate-200 overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-4 py-4 border-b border-slate-100">
                            <div className="min-w-0 pr-4">
                                <h2 className="text-lg font-black text-slate-800 truncate">
                                    <span className="hidden md:inline">제목(업체명): </span>{group.bizNumber}
                                </h2>
                                <p className="text-xs text-slate-400 font-semibold mt-0.5">
                                    총 {groupPhotos.length}장의 사진
                                </p>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                <button onClick={() => { setPrintMode(!printMode); setSelectedForPrint(new Set()); }}
                                    className={`flex items-center gap-1.5 px-3 py-2 border rounded-lg text-xs font-bold transition-colors ${printMode ? 'bg-violet-600 text-white border-violet-600' : 'bg-violet-50 text-violet-700 border-violet-200 hover:bg-violet-100'}`}>
                                    <Icon name="printer" size={14} /> <span className="hidden md:inline">{printMode ? '선택 취소' : '인쇄'}</span>
                                </button>
                                <button onClick={() => onDownload(group)}
                                    className="flex items-center gap-1.5 px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold hover:bg-emerald-100 transition-colors">
                                    <Icon name="download" size={14} /> <span className="hidden md:inline">전체 다운로드</span>
                                </button>
                                <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                    <Icon name="x" size={20} className="text-slate-400" />
                                </button>
                            </div>
                        </div>

                        <div className="overflow-y-auto p-4 md:p-6 custom-scroll flex-1">
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
                                {groupPhotos.map((p, idx) => (
                                    <div key={idx} className="group relative bg-slate-50 rounded-xl overflow-hidden border border-slate-100 hover:border-blue-200 transition-all hover:shadow-md">
                                        <div className="aspect-square overflow-hidden cursor-pointer relative" onClick={() => printMode ? togglePrintSelect(idx) : window.openLightbox(p.photoUrl)}>
                                            <img src={toThumbUrl(p.photoUrl)} alt={`사진 ${idx + 1}`}
                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                                onError={e => { e.target.src = p.photoUrl; }} />
                                            {printMode && (
                                                <div className={`absolute inset-0 flex items-center justify-center transition-all ${selectedForPrint.has(idx) ? 'bg-violet-500/30 ring-4 ring-inset ring-violet-500' : 'bg-black/5'}`}>
                                                    <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center text-sm font-black shadow-lg ${selectedForPrint.has(idx) ? 'bg-violet-600 border-violet-600 text-white' : 'bg-white/90 border-slate-300'}`}>

                                                </div>
