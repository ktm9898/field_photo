                                        <div className="p-3 space-y-1">
                                            {/* 1. 촬영일시 */}
                                            <p className="text-[11px] font-bold text-slate-500">
                                                {formatDateKr(p.datetime)}
                                            </p>
                                            
                                            {/* 2. 주소/위치 (최대 2줄) */}
                                            {(p.address || (p.lat && p.lng)) && (
                                                <p className="text-[11px] font-bold text-slate-400 line-clamp-2 min-h-[2em]">
                                                    {p.address || (Number(p.lat).toFixed(5) + ', ' + Number(p.lng).toFixed(5))}
                                                </p>
                                            )}

                                            {/* 메모 편집 UI */}
                                            {editMemoId === p.fileId ? (
                                                <div className="mt-2 space-y-2">
                                                    <textarea 
                                                        className="w-full p-2 text-xs border border-blue-200 rounded-lg outline-none focus:ring-1 ring-blue-500"
                                                        value={memoValue}
                                                        onChange={e => setMemoValue(e.target.value)}
                                                        placeholder="메모 입력..."
                                                        rows="3" autoFocus
                                                    />
                                                     <div className="flex gap-1">
                                                        <button type="button" onClick={(e) => { e.stopPropagation(); handleSaveMemo(p.fileId); }} disabled={isSaving}
                                                            className="flex-1 py-1.5 bg-blue-600 text-white text-[10px] font-bold rounded-md disabled:opacity-50">
                                                            {isSaving ? '저장중' : '저장'}
                                                        </button>
                                                        <button type="button" onClick={(e) => { e.stopPropagation(); setEditMemoId(null); }}
                                                            className="px-2 py-1.5 bg-slate-200 text-slate-600 text-[10px] font-bold rounded-md">
                                                            닫기
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="flex gap-1.5 mt-3">
                                                    <button type="button" onClick={(e) => { e.stopPropagation(); handleMemoClick(p); }}
                                                        className={`flex-1 h-9 flex items-center justify-center gap-1.5 text-xs font-bold rounded-lg transition-colors border ${p.memo ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-400 border-slate-200'}`}
                                                        title={p.memo ? "메모 있음" : "메모 추가"}>
                                                        <Icon name={p.memo ? "file-text" : "plus-square"} size={14} />
                                                        <span className="hidden md:inline">{p.memo ? "메모 있음" : "메모 추가"}</span>
                                                    </button>
                                                    
                                                    <button type="button" onClick={(e) => { e.stopPropagation(); onDownloadSingle(p, idx); }}
                                                        className="flex-1 h-9 flex items-center justify-center gap-1.5 text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg hover:bg-emerald-100 transition-colors"
                                                        title="다운로드">
                                                        <Icon name="download" size={14} />
                                                        <span className="hidden md:inline">다운로드</span>
                                                    </button>

                                                    <button type="button" onClick={(e) => { e.stopPropagation(); handleDeletePhotoClick(p); }} disabled={isSaving}
                                                        className="w-9 h-9 flex items-center justify-center text-xs font-bold bg-red-50 text-red-600 border border-red-100 rounded-lg hover:bg-red-100 transition-colors disabled:opacity-50 shrink-0"
                                                        title="삭제">
                                                        <Icon name="trash-2" size={14} />
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* ── 인쇄 선택 바 ── */}
                        {printMode && (
                            <div className="px-4 py-3 bg-violet-50 border-t border-violet-200 flex items-center justify-between shrink-0">
                                <div className="flex items-center gap-3">
                                    <span className="text-sm font-bold text-violet-700">
                                        {selectedForPrint.size > 0 ? `${selectedForPrint.size}장 선택됨` : '인쇄할 사진을 선택하세요'}
                                    </span>
                                    <button onClick={() => {
                                        if (selectedForPrint.size === groupPhotos.length) setSelectedForPrint(new Set());
                                        else setSelectedForPrint(new Set(groupPhotos.map((_, i) => i)));
                                    }} className="text-xs font-bold text-violet-500 hover:text-violet-700 transition-colors underline">
                                        {selectedForPrint.size === groupPhotos.length ? '전체 해제' : '전체 선택'}
                                    </button>
                                </div>
                                <div className="flex items-center gap-2">
                                    {selectedForPrint.size > 0 && (
                                        <button onClick={executePrint}
                                            className="px-4 py-2 bg-violet-600 text-white text-xs font-bold rounded-lg hover:bg-violet-700 transition-colors flex items-center gap-1.5 shadow-sm">
                                            <Icon name="printer" size={14} /> 인쇄하기
                                        </button>
                                    )}
                                    <button onClick={() => { setPrintMode(false); setSelectedForPrint(new Set()); }}
                                        className="px-3 py-2 bg-white text-slate-600 border border-slate-200 text-xs font-bold rounded-lg hover:bg-slate-50 transition-colors">
                                        취소
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ── 지도 뷰 ──
        const MapView = ({ records, isExpanded }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markersRef = useRef([]);
            const infoWindowRef = useRef(null);

            useEffect(() => {
                if (!mapRef.current || mapInstanceRef.current) return;
                mapInstanceRef.current = new naver.maps.Map(mapRef.current, {
                    center: new naver.maps.LatLng(37.5365, 126.9780),
                    zoom: 14,
                    logoControl: false,
                    mapDataControl: false
                });

                // 정보창 생성 (단일 인스턴스)
                infoWindowRef.current = new naver.maps.InfoWindow({
                    borderWidth: 0,
                    backgroundColor: 'transparent',
                    disableAnchor: true,
                    pixelOffset: new naver.maps.Point(0, -8)
                });

                // 지도 클릭 시 정보창 닫기
                naver.maps.Event.addListener(mapInstanceRef.current, 'click', () => {
                    if (infoWindowRef.current) infoWindowRef.current.close();
                });
            }, []);

            // 지도 크기 확장/축소 시 캔버스 재계산
            useEffect(() => {
                if (!mapInstanceRef.current) return;
                const timer = setTimeout(() => {
                    if (mapInstanceRef.current && naver.maps.Event) {
                        naver.maps.Event.trigger(mapInstanceRef.current, 'resize');
                    }
                }, 360);
                return () => clearTimeout(timer);
            }, [isExpanded]);

            useEffect(() => {
                if (!mapInstanceRef.current) return;
                markersRef.current.forEach(m => m.setMap(null));
                markersRef.current = [];
                if (infoWindowRef.current) infoWindowRef.current.close();

                const validRecords = (records || []).filter(r => r.lat && r.lng);
                const groups = {};
                validRecords.forEach(r => {
                    const key = Number(r.lat).toFixed(5) + ',' + Number(r.lng).toFixed(5);
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(r);
                });

                Object.entries(groups).forEach(([coordKey, photos]) => {
                    const first = photos[0];
                    const uniqueBizNames = [...new Set(photos.map(p => p.bizNumber))];
                    const count = uniqueBizNames.length;
                    
                    const badgeHtml = count > 1 ? `
                        <circle cx="28" cy="8" r="7" fill="white" stroke="#333" stroke-width="1.5"/>
                        <text x="28" y="11" font-size="8" font-weight="900" text-anchor="middle" fill="#333" font-family="sans-serif">${count}</text>
                    ` : '';

                    const marker = new naver.maps.Marker({
                        position: new naver.maps.LatLng(first.lat, first.lng),
                        map: mapInstanceRef.current,
                        icon: {
                            content: `<div style="width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                                <svg width="36" height="36" viewBox="0 0 40 40">
                                    <path d="M16 8C10.5 8 6 12.5 6 18c0 7.5 10 15 10 15s10-7.5 10-15c0-5.5-4.5-10-10-10z" fill="#3b82f6"/>
                                    <circle cx="16" cy="18" r="4" fill="white"/>
                                    ${badgeHtml}
                                </svg>
                            </div>`,
                            anchor: new naver.maps.Point(16, 33)
                        }
                    });

                    const bizList = uniqueBizNames.join(', ');
                    const countText = count > 1 ? `업체 ${count}곳 · ` : '';
                    const content = `<div class="marker-popup">
                        <div class="biz-name">${bizList}</div>
                        <div class="meta-info">${countText}사진 ${photos.length}장</div>
                    </div>`;

                    naver.maps.Event.addListener(marker, 'click', () => {
                        infoWindowRef.current.setContent(content);
                        infoWindowRef.current.open(mapInstanceRef.current, marker);
                    });

                    markersRef.current.push(marker);
                });

                if (markersRef.current.length > 0) {
                    const bounds = new naver.maps.LatLngBounds();
                    validRecords.forEach(r => bounds.extend(new naver.maps.LatLng(r.lat, r.lng)));
                    mapInstanceRef.current.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
                }
            }, [records]);

            return <div id="admin-map" ref={mapRef} className={isExpanded ? 'map-expanded' : ''}></div>;
        };

        // ── 메인 앱 ──
        const AdminApp = () => {
            const [viewMode, setViewMode] = useState('personal');
            const [isAuth, setIsAuth] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [records, setRecords] = useState([]);
            const [loading, setLoading] = useState(() => {
                // 촬영자 정보가 있으면 바로 로딩 시작 예정이므로 true로 초기화
                return !!localStorage.getItem('photographer_name');
            });
            const [toast, setToast] = useState(null);
            const [photoModal, setPhotoModal] = useState(null);
            const [showMap, setShowMap] = useState(false);
            const [isMapExpanded, setIsMapExpanded] = useState(false);
            const [selectedGroupKeys, setSelectedGroupKeys] = useState(new Set());

            const getGroupKey = useCallback((r) => {
                if (!r) return '';
                const fId = r.photos && r.photos[0] ? r.photos[0].fileId : '';
                return (r.bizNumber || '') + '|' + (r.photographer || '') + '|' + fId;
            }, []);

            const toggleSelectGroup = useCallback((key) => {
                setSelectedGroupKeys(prev => {
                    const next = new Set(prev);
                    if (next.has(key)) next.delete(key);
                    else next.add(key);
                    return next;
                });
            }, []);

            // 모달 오픈 시 스크롤 락
            useEffect(() => {
                if (photoModal) {
                    document.body.classList.add('modal-open');
                } else {
                    // 라이트박스가 닫혀있을 때만 해제
                    if (document.getElementById('lightbox').classList.contains('hidden')) {
                        document.body.classList.remove('modal-open');
                    }
                }
            }, [photoModal]);

            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            const [searchBiz, setSearchBiz] = useState('');
            const [searchPhotographer, setSearchPhotographer] = useState('');
            const [searchProject, setSearchProject] = useState('');
            const [showMobileFilters, setShowMobileFilters] = useState(false);
            const [appliedFilter, setAppliedFilter] = useState({});

            const getPw = () => (sessionStorage.getItem('fp_admin_pw') || '').trim();
            const getPersonalInfo = () => ({
                name: (localStorage.getItem('photographer_name') || '').trim(),
                pw: (localStorage.getItem('photographer_pw') || '').trim(),
                email: (localStorage.getItem('photographer_email') || '').trim()
            });

            const updateMemo = useCallback(async (fileId, newMemo) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); 
                
                try {
                    const params = new URLSearchParams();
                    params.append('action', 'updateMemo');
                    params.append('key', API_SECRET);
                    params.append('fileId', fileId);
                    params.append('memo', newMemo);
                    params.append('_t', Date.now()); 

                    const url = `${APPS_SCRIPT_URL}?${params.toString()}`;

                    const resp = await fetch(url, {
                        method: 'GET',
                        mode: 'cors',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!resp.ok) throw new Error('서버 응답 오류 (' + resp.status + ')');
                    
                    const res = await resp.json();
                    if (res.success) {
                        // 1. 전체 레코드 상태 즉시 업데이트 (로컬)
                        setRecords(prev => prev.map(p => p.fileId === fileId ? { ...p, memo: newMemo } : p));
                        
                        // 2. 현재 열려있는 모달 상태 즉시 업데이트 (로컬)
                        if (photoModal) {
                            setPhotoModal(prev => ({
                                ...prev,
                                photos: prev.photos.map(p => p.fileId === fileId ? { ...p, memo: newMemo } : p)
                            }));
                        }

                        setToast({ message: '메모가 저장되었습니다.', type: 'success' });
                        
                        // 3. 백그라운드에서 최신 데이터 동기화 (선택 사항)
                        loadData().catch(err => console.warn('Background sync failed:', err));
                        
                        return true;
                    } else {
                        throw new Error(res.error || '알 수 없는 오류');
                    }
                } catch (err) {
                    clearTimeout(timeoutId);
                    console.error('Memo update error:', err);
                    const msg = err.name === 'AbortError' ? '시간 초과 (네트워크 응답 없음)' : err.message;
                    setToast({ message: '메모 저장 실패: ' + msg, type: 'error' });
                    return false;
                }
            }, [photoModal]);

            const deletePhoto = useCallback(async (fileId) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); 
                
                try {
                    const params = new URLSearchParams();
                    params.append('action', 'deletePhoto');
                    params.append('key', API_SECRET);
                    params.append('fileId', fileId);
                    params.append('_t', Date.now()); 

                    const url = `${APPS_SCRIPT_URL}?${params.toString()}`;

                    const resp = await fetch(url, {
                        method: 'GET',
                        mode: 'cors',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    if (!resp.ok) throw new Error('서버 응답 오류 (' + resp.status + ')');
                    
                    const res = await resp.json();
                    if (res.success) {
                        // 1. 로컬 레코드 업데이트
                        setRecords(prev => prev.filter(p => p.fileId !== fileId));
                        
                        // 2. 현재 열린 모달 상태 업데이트
                        if (photoModal) {
                            const updatedPhotos = photoModal.photos.filter(p => p.fileId !== fileId);
                            if (updatedPhotos.length === 0) {
                                setPhotoModal(null);
                            } else {
                                setPhotoModal(prev => ({
                                    ...prev,
                                    photos: updatedPhotos
                                }));
                            }
                        }
                        setToast({ message: '사진이 삭제되었습니다.', type: 'success' });
                        return true;
                    } else {
                        throw new Error(res.error || '삭제 실패');
                    }
                } catch (err) {
                    clearTimeout(timeoutId);
                    console.error('deletePhoto error:', err);
                    const msg = err.name === 'AbortError' ? '시간 초과' : err.message;
                    setToast({ message: '삭제 실패: ' + msg, type: 'error' });
                    return false;
                }
            }, [photoModal]);

            const loadData = useCallback(async (mode, forcePw) => {
                const targetMode = mode || viewMode;
                const pw = (forcePw || getPw()).trim();
                const personal = getPersonalInfo();

                // 모드별 권한 체크
                if (targetMode === 'master' && !pw) {
                    setIsAuth(false);
                    setShowLogin(true);
                    return { success: false, error: '관리자 비밀번호를 입력해주세요.' };
                }
                if (targetMode === 'personal' && !personal.name) {
                    setIsAuth(false);
                    setShowLogin(false);
                    setToast({ message: '저장된 촬영자 정보가 없습니다. 촬영 페이지에서 본인 정보를 먼저 설정해주세요.', type: 'error' });
                    return { success: false, error: '저장된 촬영자 정보가 없습니다.' };
                }

                setLoading(true);
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                try {
                    const params = new URLSearchParams();
                    if (targetMode === 'master') {
                        params.append('action', 'getAll');
                        params.append('key', API_SECRET);
                        params.append('pw', pw);
                    } else {
                        params.append('action', 'getMyPhotos');
                        params.append('key', API_SECRET);
                        params.append('photographer', personal.name);
                        params.append('userPw', personal.pw);
                    }
                    params.append('_t', Date.now());

                    const url = `${APPS_SCRIPT_URL}?${params.toString()}`;

                    const resp = await fetch(url, {
                        method: 'GET',
                        mode: 'cors',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    const data = await resp.json();
                    if (data.success) {
                        setRecords(data.data || []);
                        setIsAuth(true);
                        setShowLogin(false);
                        setViewMode(targetMode);
                        return { success: true, data: data.data };
                    } else {
                        const errMsg = data.error || '데이터 로드에 실패했습니다.';
                        setToast({ message: errMsg, type: 'error' });
                        if (targetMode === 'master') {
                            setShowLogin(true);
                        }
                        return { success: false, error: errMsg };
                    }
                } catch (err) {
                    clearTimeout(timeoutId);
                    const errMsg = err.name === 'AbortError' ? '서버 응답 시간 초과 (네트워크 지연)' : err.message;
                    setToast({ message: '데이터 로드 실패: ' + errMsg, type: 'error' });
                    return { success: false, error: '데이터 로드 실패: ' + errMsg };
                } finally {
                    setLoading(false);
                }
            }, [viewMode]);


            useEffect(() => {
                loadData();
            }, []);

            const handleLogin = async (pw) => {
                const cleanPw = (pw || '').trim();
                const res = await loadData('master', cleanPw);
                if (res && res.success) { 
                    sessionStorage.setItem('fp_admin_pw', cleanPw);
                }
                return res;
            };

            const switchMode = (mode) => {
                if (mode === 'master') {
                    // 마스터 모드 진입 시 항상 비밀번호를 새로 묻도록 함
                    sessionStorage.removeItem('fp_admin_pw');
                    setShowLogin(true);
                } else {
                    const personal = getPersonalInfo();
                    if (!personal.name || !personal.pw) {
                        setToast({ message: '저장된 촬영자 정보(이름/비밀번호)가 없습니다. 촬영 페이지에서 본인 정보를 설정해 주세요.', type: 'error' });
                        return;
                    }
                    loadData(mode);
                }
            };

            // datetime 문자열 → YYYY-MM-DD 변환 (한글 형식 / JS Date 문자열 모두 대응)
            const toDateKey = (dt) => {
                if (!dt) return '';
                // 한글 형식: "2026년 4월 24일 ..."
                const krMatch = dt.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
                if (krMatch) {
                    return krMatch[1] + '-' + String(krMatch[2]).padStart(2, '0') + '-' + String(krMatch[3]).padStart(2, '0');
                }
                // JS Date 문자열: "Fri Apr 24 2026 10:23:00 GMT+0900 ..."
                const d = new Date(dt);
                if (!isNaN(d.getTime())) {
                    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                }
                return dt.substring(0, 10);
            };

            const projectList = useMemo(() => {
                const set = new Set();
                records.forEach(r => {
                    const p = (r.project || '').trim() || '미지정';
                    set.add(p);
                });
                return Array.from(set);
            }, [records]);

            const filteredRecords = useMemo(() => {
                return records.filter(r => {
                    const dateKey = toDateKey(r.datetime);
                    if (appliedFilter.dateFrom && dateKey < appliedFilter.dateFrom) return false;
                    if (appliedFilter.dateTo && dateKey > appliedFilter.dateTo) return false;
                    if (appliedFilter.searchBiz && !(r.bizNumber || '').includes(appliedFilter.searchBiz)) return false;
                    if (appliedFilter.searchPhotographer && !(r.photographer || '').includes(appliedFilter.searchPhotographer)) return false;
                    if (appliedFilter.searchProject && ((r.project || '').trim() || '미지정') !== appliedFilter.searchProject) return false;
                    return true;
                }).sort((a, b) => {
                    const timeA = new Date(a.datetime).getTime() || 0;
                    const timeB = new Date(b.datetime).getTime() || 0;
                    return timeB - timeA; // 최신순 정렬
                });
            }, [records, appliedFilter]);

            const PAGE_SIZE = 20;
            const [currentPage, setCurrentPage] = useState(1);
            const isInitialLoadDone = useRef(false);

            const groupedRecords = useMemo(() => {
                const groups = [];
                let currentGroup = null;

                for (const r of filteredRecords) {
                    if (!currentGroup) {
                        currentGroup = { ...r, photos: [r] };
                    } else {
                        if (currentGroup.bizNumber === r.bizNumber &&
                            currentGroup.photographer === r.photographer) {
                            currentGroup.photos.push(r);
                        } else {
                            groups.push(currentGroup);
                            currentGroup = { ...r, photos: [r] };
                        }
                    }
                }
                if (currentGroup) groups.push(currentGroup);
                return groups;
            }, [filteredRecords]);

            // 로딩이 끝나고 그룹화된 결과가 나오면 메시지 표시
            useEffect(() => {
                if (!loading && records.length > 0) {
                    setToast({ message: `현장사진 ${groupedRecords.length}건을 불러왔습니다.`, type: 'success' });
                }
            }, [loading]);

            useEffect(() => {
                setCurrentPage(1);
            }, [appliedFilter]);

            const totalPages = Math.ceil(groupedRecords.length / PAGE_SIZE);
            const paginatedGroups = useMemo(() => {
                const start = (currentPage - 1) * PAGE_SIZE;
                return groupedRecords.slice(start, start + PAGE_SIZE);
            }, [groupedRecords, currentPage]);

            const toggleSelectAllPaginated = (isSelectAll) => {
                if (isSelectAll) {
                    const next = new Set(selectedGroupKeys);
                    paginatedGroups.forEach(r => next.add(getGroupKey(r)));
                    setSelectedGroupKeys(next);
                } else {
                    const next = new Set(selectedGroupKeys);
                    paginatedGroups.forEach(r => next.delete(getGroupKey(r)));
                    setSelectedGroupKeys(next);
                }
            };

            const isAllPaginatedSelected = paginatedGroups.length > 0 && paginatedGroups.every(r => selectedGroupKeys.has(getGroupKey(r)));

            // ── 1) 일괄 프로젝트 변경 ──
            const handleBatchUpdateProject = async () => {
                if (selectedGroupKeys.size === 0) {
                    setToast({ message: '프로젝트를 변경할 항목을 선택해 주세요.', type: 'info' });
                    return;
                }
                const selectedGroups = groupedRecords.filter(r => selectedGroupKeys.has(getGroupKey(r)));
                const fileIds = selectedGroups.flatMap(r => r.photos.map(p => p.fileId)).filter(Boolean);
                if (fileIds.length === 0) return;

                const existingListStr = projectList.length > 0 ? `\n(등록된 프로젝트 목록: ${projectList.join(', ')})` : '';
                const targetProj = prompt(`선택한 ${selectedGroupKeys.size}개 업체 (총 ${fileIds.length}장 사진)의 변경할 프로젝트명을 입력하세요.${existingListStr}`, '미지정');
                if (targetProj === null) return;
                const cleanProj = targetProj.trim() || '미지정';

                setLoading(true);
                try {
                    const res = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'updateProject',
                            key: API_SECRET,
                            fileIds: fileIds,
                            project: cleanProj
                        })
                    });
                    const result = await res.json();
                    if (result.success) {
                        const idSet = new Set(fileIds);
                        setRecords(prev => prev.map(p => idSet.has(p.fileId) ? { ...p, project: cleanProj } : p));
                        setSelectedGroupKeys(new Set());
                        setToast({ message: `${selectedGroupKeys.size}개 업체의 프로젝트가 '${cleanProj}'(으)로 변경되었습니다.`, type: 'success' });
                    } else {
                        setToast({ message: '프로젝트 변경 실패: ' + result.error, type: 'error' });
                    }
                } catch (err) {
                    setToast({ message: '프로젝트 변경 오류: ' + err.message, type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            // ── 2) 일괄 삭제 ──
            const handleBatchDelete = async () => {
                if (selectedGroupKeys.size === 0) {
                    setToast({ message: '삭제할 항목을 선택해주세요.', type: 'info' });
                    return;
                }
                
                const selectedGroups = groupedRecords.filter(r => selectedGroupKeys.has(getGroupKey(r)));
                const fileIds = selectedGroups.flatMap(r => r.photos.map(p => p.fileId)).filter(Boolean);
                
                if (fileIds.length === 0) return;

                if (!confirm(`선택한 ${selectedGroupKeys.size}개 업체 (총 ${fileIds.length}장의 사진)를 정말 삭제하시겠습니까?\n(구글 드라이브 휴지통 이동 및 구글 시트에서 삭제됩니다)`)) {
                    return;
                }

                setLoading(true);
                try {
                    const res = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'deletePhotos',
                            key: API_SECRET,
                            fileIds: fileIds
                        })
                    });
                    const result = await res.json();
                    if (result.success) {
                        const idSet = new Set(fileIds);
                        setRecords(prev => prev.filter(p => !idSet.has(p.fileId)));
                        setSelectedGroupKeys(new Set());
                        setToast({ message: `${selectedGroupKeys.size}개 업체 (${fileIds.length}장 사진)가 삭제되었습니다.`, type: 'success' });
                    } else {
                        setToast({ message: '삭제 실패: ' + result.error, type: 'error' });
                    }
                } catch (err) {
                    console.error('handleBatchDelete error:', err);
                    setToast({ message: '삭제 중 오류: ' + err.message, type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            // ── 3) 일괄 다운로드 (ZIP) ──
            const handleBatchDownloadZip = async () => {
                if (selectedGroupKeys.size === 0) {
                    setToast({ message: '다운로드할 항목을 선택해주세요.', type: 'info' });
                    return;
                }
                const selectedGroups = groupedRecords.filter(r => selectedGroupKeys.has(getGroupKey(r)));
                const photos = selectedGroups.flatMap(r => r.photos);
                if (photos.length === 0) return;

                setToast({ message: `사진 ${photos.length}장을 ZIP 압축 파일로 생성하는 중입니다...`, type: 'info' });
                try {
                    if (typeof JSZip === 'undefined') {
                        throw new Error('JSZip 라이브러리가 로드되지 않았습니다.');
                    }
                    const zip = new JSZip();
                    let count = 0;
                    for (let i = 0; i < photos.length; i++) {
                        const p = photos[i];
                        if (!p.fileId) continue;
                        const res = await fetch(APPS_SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'getFileBase64', key: API_SECRET, fileId: p.fileId })
                        });
                        const result = await res.json();
                        if (result.success && result.base64) {
                            const folderName = (p.bizNumber || '업체').replace(/[/\\?%*:|"<>]/g, '_');
                            const fileName = p.fileName || `photo_${i + 1}.jpg`;
                            zip.folder(folderName).file(fileName, result.base64, { base64: true });
                            count++;
                        }
                        if (i < photos.length - 1) await new Promise(r => setTimeout(r, 150));
                    }
                    if (count === 0) throw new Error('다운로드 가능한 사진 데이터가 없습니다.');
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    const zipFileName = `현장사진_${searchProject || '전체'}_${new Date().toISOString().split('T')[0]}.zip`;
                    if (typeof saveAs !== 'undefined') {
                        saveAs(zipBlob, zipFileName);
                    } else {
                        const url = URL.createObjectURL(zipBlob);
                        const a = document.createElement('a');
                        a.href = url; a.download = zipFileName; a.click();
                        URL.revokeObjectURL(url);
                    }
                    setToast({ message: `${count}장 사진 ZIP 압축 다운로드 완료!`, type: 'success' });
                } catch (err) {
                    console.error('ZIP 다운로드 오류:', err);
                    setToast({ message: 'ZIP 압축 다운로드 오류: ' + err.message, type: 'error' });
                }
            };

            // ── 4) 일괄 메일발송 (ZIP) ──
            const handleBatchSendEmailZip = async () => {
                if (selectedGroupKeys.size === 0) {
                    setToast({ message: '메일 발송할 항목을 선택해주세요.', type: 'info' });
                    return;
                }
                const selectedGroups = groupedRecords.filter(r => selectedGroupKeys.has(getGroupKey(r)));
                const fileIds = selectedGroups.flatMap(r => r.photos.map(p => p.fileId)).filter(Boolean);
                if (fileIds.length === 0) return;

                const lastEmail = localStorage.getItem('last_send_email') || '';
                const targetEmail = prompt(`선택한 ${selectedGroupKeys.size}개 업체 (총 ${fileIds.length}장 사진)를 첨부 메일로 받으실 주소를 입력하세요.`, lastEmail);
                if (!targetEmail) return;
                localStorage.setItem('last_send_email', targetEmail);

                setToast({ message: 'ZIP 압축 파일 형태로 이메일 발송을 요청 중입니다...', type: 'info' });
                try {
                    const pw = sessionStorage.getItem('fp_admin_pw');
                    const res = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'sendEmail',
                            key: API_SECRET,
                            pw,
                            projectName: searchProject || '선택목록',
                            email: targetEmail,
                            fileIds: fileIds,
                            isZip: true
                        })
                    });
                    const result = await res.json();
                    if (result.success) setToast({ message: '이메일(ZIP 첨부) 발송을 완료했습니다.', type: 'success' });
                    else setToast({ message: '발송 실패: ' + result.error, type: 'error' });
                } catch (err) {
                    setToast({ message: '네트워크 오류: ' + err.message, type: 'error' });
                }
            };

            const stats = useMemo(() => {
                const now = new Date();
                const todayKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                const todayCount = records.filter(r => toDateKey(r.datetime) === todayKey).length;
                
                // 사진 목록과 동일한 그룹화 로직 적용 (전체 데이터 대상)
                const sortedAll = [...records].sort((a, b) => {
                    const tA = new Date(a.datetime).getTime() || 0;
                    const tB = new Date(b.datetime).getTime() || 0;
                    return tB - tA;
                });
                
                let groupCount = 0;
                let lastBiz = null, lastPhotographer = null;
                for (const r of sortedAll) {
                    if (r.bizNumber !== lastBiz || r.photographer !== lastPhotographer) {
                        groupCount++;
                        lastBiz = r.bizNumber;
                        lastPhotographer = r.photographer;
                    }
                }

                const photographerSet = new Set(records.map(r => r.photographer).filter(Boolean));
                return { total: records.length, today: todayCount, bizCount: groupCount, photographerCount: photographerSet.size };
            }, [records]);

            const downloadCSV = () => {
                const headers = ['촬영일시', '촬영자', '제목(업체명)', '위도', '경도', '주소', '사진URL', '메모', '파일명'];
                const rows = [headers.join(',')];
                filteredRecords.forEach(r => {
                    rows.push([r.datetime, r.photographer, r.bizNumber, r.lat, r.lng, r.address, r.photoUrl, r.memo, r.fileName]
                        .map(v => '"' + (v || '').toString().replace(/"/g, '""') + '"')
                        .join(','));
                });
                const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = '현장사진_' + new Date().toISOString().split('T')[0] + '.csv'; a.click();
                URL.revokeObjectURL(url);
            };

            const triggerDownload = async (p, index = 0) => {
                if (!p.fileId) return false;
                try {
                    const res = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'getFileBase64',
                            key: API_SECRET,
                            fileId: p.fileId
                        })
                    });
                    const result = await res.json();
                    if (!result.success) throw new Error(result.error);

                    const byteCharacters = atob(result.base64);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let j = 0; j < byteCharacters.length; j++) {
                        byteNumbers[j] = byteCharacters.charCodeAt(j);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: result.mimeType || 'image/jpeg' });
                    
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = p.fileName || `photo_${index + 1}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    return true;
                } catch (e) {
                    console.error('다운로드 실패:', p.fileName, e);
                    return false;
                }
            };

            const downloadGroup = async (group) => {
                if (!group.photos || !group.photos.length) return;
                setToast({ message: `${group.photos.length}장 다운로드를 시작합니다...`, type: 'info' });
                let successCount = 0;
                
                for (let i = 0; i < group.photos.length; i++) {
                    const ok = await triggerDownload(group.photos[i], i);
                    if (ok) successCount++;
                    if (i < group.photos.length - 1) await new Promise(r => setTimeout(r, 650));
                }
                setToast({ message: `${successCount}/${group.photos.length}장 다운로드 완료`, type: 'success' });
            };

            const handleSendEmailRow = async (group) => {
                const lastEmail = localStorage.getItem('last_send_email') || '';
                const defaultEmail = group.email || lastEmail;
                const targetEmail = prompt('어떤 이메일로 발송하시겠습니까?', defaultEmail);
                
                if (!targetEmail) return;
                localStorage.setItem('last_send_email', targetEmail); // 입력한 주소 기억
                
                setToast({ message: '메일 발송을 요청했습니다. (첨부파일 크기에 따라 시간이 걸릴 수 있습니다.)', type: 'info' });
                try {
                    const pw = sessionStorage.getItem('fp_admin_pw');
                    const fileIds = group.photos.map(p => p.fileId).filter(Boolean);
                    const res = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'sendEmail', key: API_SECRET, pw, bizNumber: group.bizNumber, email: targetEmail, fileIds })
                    });
                    const result = await res.json();
                    if (result.success) setToast({ message: '이메일 발송을 완료했습니다.', type: 'success' });
                    else setToast({ message: '발송 실패: ' + result.error, type: 'error' });
                } catch(err) {
                    setToast({ message: '네트워크 오류: ' + err.message, type: 'error' });
                }
            };

            return (
                <div className="min-h-screen bg-slate-100">
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}

                    {showLogin || (!isAuth && !loading) ? (
                        <Login onLogin={handleLogin} />
                    ) : (
                        <div className="min-h-screen pb-12">
                            {/* ── 모바일 헤더 (< 768px) ── */}
                            <div className="md:hidden bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white shadow-xl">
                                <div className="px-4 py-3 flex items-center justify-between">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
                                            <Icon name="camera" size={16} className="text-white" />
                                        </div>
                                        <div>
                                            <h1 className="text-sm font-black tracking-tight">현장사진 보관함</h1>
                                            <p className="text-[10px] text-slate-400 font-semibold">{getPersonalInfo().name}님의 촬영 기록</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <button onClick={() => setShowMap(m => !m)}
                                            className={`px-3 py-2 rounded-lg font-bold transition-colors flex items-center justify-center ${showMap ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-300'}`}>
                                            <Icon name="map" size={16} />
                                        </button>
                                        <a href="index.html"
                                            className="px-3 py-2 bg-blue-600 text-white rounded-lg font-bold text-xs flex items-center gap-1 leading-none h-[34px] flex items-center">
                                            <Icon name="camera" size={13} /> 촬영
                                        </a>
                                    </div>
                                </div>
                            </div>

                            {/* ── 모바일 통계 바 (< 768px) ── */}
                            <div className="md:hidden bg-white border-b border-slate-200 px-3 py-2.5">
                                <div className="grid grid-cols-3 gap-0 divide-x divide-slate-100">
                                    {[
                                        { label: '업체(방문)', value: stats.bizCount, unit: '건', color: 'text-orange-500' },
                                        { label: '전체', value: stats.total, unit: '장', color: 'text-blue-600' },
                                        { label: '오늘', value: stats.today, unit: '장', color: 'text-emerald-600' },
                                    ].map(s => (
                                        <div key={s.label} className="text-center px-1">
                                            <p className="text-[10px] text-slate-400 font-bold">{s.label}</p>
                                            <p className={`text-base font-black ${s.color}`}>{s.value}<span className="text-[10px] text-slate-400 ml-0.5">{s.unit}</span></p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* ── 모바일 검색 바 (< 768px) ── */}
                            <div className="md:hidden bg-white border-b border-slate-200 px-3 py-2.5 flex flex-col gap-2">
                                <div className="flex items-center gap-1.5">
                                    <div className="relative flex-1">
                                        <Icon name="search" size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input type="text" placeholder="업체명 검색..." 
                                            className="w-full pl-8 pr-3 h-[38px] text-sm border border-slate-200 rounded-lg outline-none focus:border-blue-400 bg-slate-50 font-semibold"
                                            value={searchBiz} onChange={e => setSearchBiz(e.target.value)} />
                                    </div>
                                    <div className="flex gap-1 shrink-0">
                                        <button onClick={() => setAppliedFilter({ dateFrom, dateTo, searchBiz, searchPhotographer, searchProject })}
                                            className="h-[38px] px-3 bg-slate-800 text-white text-xs font-bold rounded-lg shadow-sm active:scale-95 transition-transform">
                                            조회
                                        </button>
                                        <button onClick={() => setShowMobileFilters(!showMobileFilters)}
                                            className={`h-[38px] w-9 flex items-center justify-center border rounded-lg active:scale-95 transition-all text-xs font-bold ${showMobileFilters ? 'bg-blue-50 border-blue-200 text-blue-600' : 'bg-white border-slate-200 text-slate-500'}`} title="상세 필터">
                                            <Icon name="filter" size={14} />
                                        </button>
                                        <button onClick={() => { setDateFrom(''); setDateTo(''); setSearchBiz(''); setSearchPhotographer(''); setSearchProject(''); setAppliedFilter({}); }}
                                            className="h-[38px] w-9 flex items-center justify-center border border-slate-200 text-slate-400 rounded-lg active:scale-95 transition-transform bg-white" title="필터 초기화">
                                            <Icon name="rotate-ccw" size={14} />
                                        </button>
                                        <button onClick={() => loadData()}
                                            className="h-[38px] w-9 flex items-center justify-center bg-blue-600 text-white rounded-lg active:scale-95 transition-transform shadow-sm" title="새로고침">
                                            <div className={loading ? 'animate-spin' : ''} style={{ display: 'flex' }}>
                                                <Icon name="refresh-cw" size={14} />
                                            </div>
                                        </button>
                                    </div>
                                </div>
                                
                                {showMobileFilters && (
                                    <div className="flex flex-col gap-2 p-2 bg-slate-50 rounded-lg border border-slate-100 animate-in fade-in slide-in-from-top-1 duration-200">
                                        <div className="flex items-center gap-2">
                                            <div className="flex-1 space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 ml-1">시작일</label>
                                                <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)}
                                                    className="w-full bg-white border border-slate-200 text-xs font-bold text-slate-600 outline-none h-9 px-2 rounded-lg" />
                                            </div>
                                            <span className="text-slate-300 font-bold mt-5">~</span>
                                            <div className="flex-1 space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 ml-1">종료일</label>
                                                <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)}
                                                    className="w-full bg-white border border-slate-200 text-xs font-bold text-slate-600 outline-none h-9 px-2 rounded-lg" />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="flex-1 space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 ml-1">프로젝트</label>
                                                <select value={searchProject} onChange={e => setSearchProject(e.target.value)}
                                                    className="w-full bg-white border border-slate-200 text-xs font-bold text-slate-600 outline-none h-9 px-2 rounded-lg">
                                                    <option value="">전체 프로젝트</option>
                                                    {projectList.map(p => (
                                                        <option key={p} value={p}>{p}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div className="flex-1 space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 ml-1">촬영자</label>
                                                <input type="text" placeholder="촬영자 이름..." value={searchPhotographer} onChange={e => setSearchPhotographer(e.target.value)}
                                                    className="w-full bg-white border border-slate-200 text-xs font-bold text-slate-600 outline-none h-9 px-2 rounded-lg" />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* ── PC 헤더 (>= 768px) ── */}
                            <div className="hidden md:block bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white shadow-2xl">
                                <div className="max-w-7xl mx-auto px-6 py-5">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                                                <Icon name="camera" size={22} className="text-white" />
                                            </div>
                                            <div>
                                                <h1 className="text-xl font-black tracking-tight flex items-center gap-2">
                                                    현장사진 보관함
                                                    <span className={`text-[10px] px-1.5 py-0.5 rounded uppercase ${viewMode === 'master' ? 'bg-red-500 text-white' : 'bg-blue-500 text-white'}`}>
                                                        {viewMode === 'master' ? 'Master' : 'Personal'}

                                                    })
                                                    .map((p, i, arr) => (
                                                        <React.Fragment key={p}>
                                                            {i > 0 && arr[i-1] !== p - 1 && <span className="text-slate-300 px-1">...</span>}
                                                            <button onClick={() => setCurrentPage(p)}
                                                                className={`w-9 h-9 rounded-lg font-bold text-xs transition-all ${currentPage === p ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-white border border-transparent hover:border-slate-200'}`}>
                                                                {p}
                                                            </button>
                                                        </React.Fragment>
                                                    ))
                                                }
                                            </div>

                                            <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages}
                                                className={`p-2 rounded-lg border transition-all ${currentPage === totalPages ? 'text-slate-300 border-slate-200 cursor-not-allowed' : 'text-slate-600 border-slate-200 hover:bg-white'}`}>
                                                <Icon name="chevron-right" size={16} />
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* ── 사진 갤러리 모달 ── */}
                            {photoModal && (
                                <PhotoGalleryModal 
                                    group={photoModal} 
                                    onClose={() => setPhotoModal(null)} 
                                    onDownload={downloadGroup}
                                    onDownloadSingle={triggerDownload}
                                    memoUpdater={updateMemo}
                                    photoDeleter={deletePhoto}
                                />
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>

</html>
